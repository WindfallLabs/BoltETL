[project]
name = "boltetl"
version = "0.3.0-dev"
description = "Python framework for local data processing pipelines (extract, transform, and load)."
requires-python = ">=3.13.1"
readme = "README.md"
authors = [
    { name = "Garin Wally", email = "gwally@mountainline.com" }
]
dependencies = [
    "cyclopts>=3.24.0",
    "dotenv>=0.9.9",
    "duckdb>=1.4.0",
    "fastexcel>=0.16.0",
    "geopandas>=1.1.1",
    "mypy>=1.18.2",
    "pandas>=2.3.2",
    "polars>=1.33.1",
    "pyarrow>=21.0.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "rich>=14.1.0",
]

[project.scripts]
boltcli = "boltetl.boltcli:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[project.urls]
Homepage = 'https://github.com/WindfallLabs/BoltETL'
Documentation = 'https://github.com/WindfallLabs/BoltETL'
Funding = 'https://github.com/WindfallLabs/BoltETL'
Source = 'https://github.com/WindfallLabs/BoltETL'
Changelog = 'https://github.com/WindfallLabs/BoltETL/blob/main/CHANGELOG.md'

[dependency-groups]
dev = [
    'coverage[toml]',
    'invoke',
    'pytest',
]
docs = [
    'mkdocs',
    'mkdocs-material',
    'mkdocstrings-python',
]
linting = [
    'ruff',
]
typechecking = [
    'mypy',
]
all = [
  { include-group = 'dev' },
  { include-group = 'docs' },
  { include-group = 'linting' },
  { include-group = 'typechecking' },
]

[tool.pytest.ini_options]
testpaths = 'tests'

[tool.ruff]
line-length = 100
target-version = 'py313'

[tool.ruff.format]
quote-style = 'double'
