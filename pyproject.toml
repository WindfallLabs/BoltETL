[project]
name = "boltetl"
version = "0.3.0-dev"
description = "Python framework for local data processing pipelines (extract, transform, and load)."
authors = [
    {name = "Garin Wally", email = "garwall101@gmail.com"}
]
readme = 'README.md'
requires-python = ">=3.13.1"
dependencies = [
    "cyclopts>=3.12.0",
    "dotenv>=0.9.9",
    "duckdb>=1.2.1",
    "fastexcel>=0.13.0",
    "geopandas>=1.0.1",
    "holidays>=0.69",
    "invoke>=2.2.0",
    "ipython>=9.1.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.11",
    "mkdocstrings-python>=1.16.10",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "polars>=1.26.0",
    "pyarrow>=19.0.1",
    "pyodbc>=5.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "rich>=14.0.0",
    "sqlalchemy>=2.0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = 'https://github.com/WindfallLabs/BoltETL'
Documentation = 'https://github.com/WindfallLabs/BoltETL'
Funding = 'https://github.com/WindfallLabs/BoltETL'
Source = 'https://github.com/WindfallLabs/BoltETL'
Changelog = 'https://github.com/WindfallLabs/BoltETL/blob/main/CHANGELOG.md'

[dependency-groups]
dev = [
    'coverage[toml]',
    'invoke',
    'pytest',
]
docs = [
    'mkdocs',
    'mkdocs-material',
    'mkdocstrings-python',
]
linting = [
    'ruff',
]
typechecking = [
    'mypy',
]
all = [
  { include-group = 'dev' },
  { include-group = 'docs' },
  { include-group = 'linting' },
  { include-group = 'typechecking' },
]

[tool.pytest.ini_options]
testpaths = 'tests'

[tool.ruff]
line-length = 100
target-version = 'py313'

[tool.ruff.format]
quote-style = 'double'
